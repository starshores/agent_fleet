# Re-inject MasterAgent's role contract after Codex compacts this project session.
[[hooks.SessionStart]]
matcher = "^compact$"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'C:\path\to\python.exe -B C:\apphome\agent_fleet\.codex\hooks\reinject_masteragent_context.py'
timeout = 30
statusMessage = "Restoring MasterAgent role context"
additionalContextLimit = 12000

# Keep an explicitly registered Codex role listening across startup/resume.
# New threads require a one-shot project-scoped assignment; never infer cwd/PID.
[[hooks.SessionStart]]
matcher = "^(startup|resume)$"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'C:\path\to\python.exe -B C:\apphome\agent_fleet\.codex\hooks\agentbus_codex_session_context.py'
timeout = 10
additionalContextLimit = 12000

[[hooks.SessionStart.hooks]]
type = "command"
command = 'C:\path\to\python.exe -B C:\apphome\agent_fleet\.codex\hooks\agentbus_codex_session_start.py'
async = true
timeout = 86400
statusMessage = "Restoring this Codex session’s agent-bus wait"
